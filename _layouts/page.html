---
layout: default
---
<div class="mx-auto max-w-3xl px-4 py-10 sm:px-6 sm:py-14">
  <header class="border-b border-stone-200 pb-6">
    <h1 class="text-3xl font-bold tracking-tight text-stone-900">{{ page.title }}</h1>
    {% if page.description %}<p class="mt-3 text-lg text-stone-600">{{ page.description }}</p>{% endif %}
  </header>

  <article class="lesson mt-8">
    {{ content | replace: '<table>', '<div class="my-6 overflow-x-auto"><table>' | replace: '</table>', '</table></div>' }}
  </article>
</div>
