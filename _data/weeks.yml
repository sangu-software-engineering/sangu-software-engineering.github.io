# The course agenda: one entry per week, in teaching order.
# `number` is the only place week numbers are set. `key` is a stable name that
# lessons and _includes/week.html use to refer to a week, so keep keys unchanged
# when weeks move. `part` names the week's part in _data/parts.yml. Each week
# brings its own small examples; see AUTHORING.md.
- number: 1
  key: foundations
  part: foundations-and-tooling
  title: "Software engineering foundations and clean code"
  theme: "From a problem to clean, working software"
  summary: "Refresh Java with small programs, and see how industry-strength software differs from a student project. Connect the lifecycle, estimates, and professional responsibility to clean code, small modules, refactoring, and quality metrics."
  url: "/lessons/week-01/"
- number: 2
  key: git
  part: foundations-and-tooling
  title: "Version control and collaborative development"
  theme: "Save, explain, and review changes"
  summary: "Learn local Git before remote collaboration, branching, merging, and pull requests. Introduce code review, issue tracking, Markdown, and README documentation."
- number: 3
  key: build-tools
  part: foundations-and-tooling
  title: "Build tools and dependency management"
  theme: "Make a project repeatable before it grows"
  summary: "Use Maven for project structure, dependencies, and packaging, with a wrapper for repeatable builds. Add JUnit as the first dependency, turn the first lesson's checks into tests that Maven runs, and compare Gradle briefly."
- number: 4
  key: requirements
  part: understand-and-design
  title: "Requirements and workflow modelling with UML and Mermaid"
  theme: "Describe the behaviour before building it"
  summary: "Describe stakeholder needs with clear requirements, acceptance criteria, and behavioural contracts. Introduce UML use case and activity diagrams, Mermaid flowcharts, and GitHub rendering."
- number: 5
  key: process
  part: understand-and-design
  title: "Development processes and project planning"
  theme: "Turn requirements into manageable work"
  summary: "Compare development processes and organise requirements into small increments. Explore Agile, Scrum, Kanban, estimation, risk, scope changes, and team responsibilities."
- number: 6
  key: design
  part: understand-and-design
  title: "Modular programming and object-oriented design"
  theme: "Give code clear responsibilities"
  summary: "Give functions, classes, and interfaces clear responsibilities. Explore cohesion, coupling, composition, and selected SOLID principles; connect UML and Mermaid class diagrams to implementation."
- number: 7
  key: testing
  part: verify-and-improve
  title: "Behaviour, testing, and debugging"
  theme: "Observe behaviour and investigate failures"
  summary: "Grow the first tests into deliberate test design with partitions, boundaries, and state transitions, and investigate errors with systematic debugging and regression tests."
- number: 8
  key: quality
  part: verify-and-improve
  title: "Code quality, safe refactoring, and continuous integration"
  theme: "Improve safely and automate checks"
  summary: "Use tests to support refactoring and TDD. Examine quality metrics and coverage limits, then reuse the Maven build setup in GitHub Actions."
- number: 9
  key: architecture
  part: system-and-security
  title: "Architecture and component interactions"
  theme: "Connect modules into a system"
  summary: "Split the application into layers: a small HTTP API, the order service, and a repository that stores orders in a database through JDBC. Use component and sequence diagrams, integration tests, and quality attributes to explain system-wide decisions."
- number: 10
  key: security
  part: system-and-security
  title: "Secure and responsible software construction"
  theme: "Build with responsibility"
  summary: "Identify threats at the HTTP and database boundaries, and protect access, inputs, queries, dependencies, and secrets. Address privacy, accessibility, attribution, and verification of AI-generated code."
- number: 11
  key: docker
  part: deliver-and-operate
  title: "Runtime environments, Docker, and deployment modelling"
  theme: "Make the runtime reproducible"
  summary: "Understand processes and runtime configuration before introducing Docker images, containers, networks, volumes, and Compose, which runs the application with a database service. Map software to its runtime using deployment views."
- number: 12
  key: delivery
  part: deliver-and-operate
  title: "DevOps, delivery pipelines, and documentation publishing"
  theme: "Release with confidence"
  summary: "Extend CI into controlled delivery with versioned artifacts, quality gates, smoke tests, and rollback. Publish documentation and Mermaid diagrams, installing the Mermaid CLI with npm and comparing npm with Maven and Yarn."
- number: 13
  key: operations
  part: deliver-and-operate
  title: "Logging, observability, maintenance, and integrated review"
  theme: "Understand and evolve running software"
  summary: "Diagnose running systems using logs, metrics, traces, and health checks. Manage changes, incidents, and dependencies, then review one requirement through the full lifecycle."
